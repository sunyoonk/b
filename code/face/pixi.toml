[workspace]
name = "cuit1"
version = "0.1.0"
description = "FACE: mapping collaborative filtering embeddings into LLM tokens"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
# 3.11 rather than the sibling envs' 3.10: requirements.txt pins scipy 1.16.2, and
# scipy >=1.16 has no build for python 3.10 on conda-forge. FACE's README asks for >=3.9.
python = "3.11.*"
# requirements.txt pins numpy 1.22.4, but its own scipy 1.16.2 requires numpy >= 1.25.2.
# The pin is internally inconsistent, so stay on the 1.x line instead of the exact patch.
numpy = "<2"
scipy = "==1.16.2"
pandas = "==2.3.3"
pyyaml = "==6.0.2"
tqdm = "==4.66.5"
pytest = ">=8"
openpyxl = ">=3.1"

[pypi-dependencies]
# requirements.txt pins torch 1.13.1 (and torch_sparse built for pt113cu117), but this
# machine's Blackwell GPUs (sm_120) need CUDA 12.8+, so we use the cu128 build --
# same substitution as ../IDGenRec and ../ETEGRec.
torch = { version = "==2.8.0", index = "https://download.pytorch.org/whl/cu128" }
transformers = "==4.46.0"
# encoder/trainer/logger.py and encoder/models/loss_utils.py import this at module level.
swanlab = "==0.6.13"
# tokenizers: requirements.txt pins 0.22.1, which transformers 4.46.0 refuses
# (it requires >=0.20,<0.21). Left unpinned so transformers pulls the version it supports.
# torch_sparse: the pinned 0.6.17+pt113cu117 wheel cannot exist for torch 2.8/cu128.
# Only used inside encoder/models/aug_utils.py:89 (lazy import, augmentation path only).
# torch_xla 2.8.1: TPU runtime, no usage anywhere in the tree.
# mteb 2.1.0: no usage anywhere in the tree.
